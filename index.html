<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建物調査アシスト Ver.0.5</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#155da9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="./icon-192.png">
<style>body{margin:0;background:#edf2f6;color:#17324a;font:15px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:12px}h1{font-size:21px;margin:6px 0}.panel{background:white;padding:14px;border-radius:14px;margin:10px 0;border:1px solid #d9e1e9}.buttons{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}button{padding:12px;border:1px solid #9eb3c4;border-radius:9px;background:white;color:#17324a;font-size:14px}button.active{background:#155da9;color:white}.map{width:100%;height:min(58vh,520px);background:#f8fafc;border:1px solid #ccd9e4;border-radius:10px;touch-action:none}input,select{font-size:16px;padding:9px;width:100%;box-sizing:border-box}label{display:block;margin-top:9px;font-size:13px}.status{white-space:pre-wrap;background:#eff6ff;padding:10px;border-radius:8px;min-height:36px;font-size:13px}.grid{display:grid;gap:12px}@media(min-width:850px){.grid{grid-template-columns:1.5fr 1fr}}.small{font-size:12px;color:#53677a}</style></head>
<body><div class="wrap"><h1>建物調査アシスト <small>Ver.0.5</small></h1><div class="grid"><section class="panel"><b>敷地・建物作図</b><div class="buttons"><button id="demo">サンプル敷地を表示</button><button id="fit">全体表示</button></div><label>SIMAファイル（Wingneo INFINITY）<input id="file" type="file" accept=".sim,.sima,.txt"></label><div class="buttons"><button id="cad" class="active">CAD作図</button><button id="free">手書き</button><button id="select">頂点移動</button><button id="close">外周を閉じる</button><button id="undo">1点戻す</button><button id="clear">建物消去</button></div><svg id="map" class="map" viewBox="0 0 400 480"><rect width="400" height="480" fill="#f8fafc"/><g id="layer"></g></svg><p class="small">緑：敷地　青：建物。図面をタップして建物の頂点を追加できます。</p></section><section class="panel"><b>読み込み状況</b><p id="offlineState" class="small">通信状態を確認中</p><p id="status" class="status">起動しました。まず「サンプル敷地を表示」を押してください。</p><p id="info" class="small">敷地：未読込</p><label>辺の選択<select id="edge"><option>辺を作図してください</option></select></label><label>実測寸法（m）<input id="length" type="number" step=".001"></label><label>測定位置<select id="measure"><option>外壁外面</option><option>内壁内面</option><option>柱外面</option><option>柱中心</option><option>求積位置を直接測定</option></select></label><label>柱せい（mm）<input id="column" type="number" value="200"></label><label>胴縁厚（mm）<input id="furring" type="number" value="100"></label><label>外壁厚（mm）<input id="wall" type="number" value="25"></label><div class="buttons"><button id="calc">柱芯までの補正候補</button><button id="saveEdge">辺の記録を保存</button></div><p id="offset" class="status">オフセット：未計算</p><div class="buttons"><button id="json">JSONバックアップ出力</button><button id="restore">JSON復元</button><input id="restoreFile" type="file" accept=".json,application/json" style="display:none"><button id="dxf">DXF出力</button><button id="sima">SIMA出力（試験）</button></div><p class="small">検証用試作品です。求積位置の法的判断・図形拘束・閉合差計算・Wingneo実機互換は未検証です。正式成果には使用しないでください。</p></section></div></div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id), svg=$("map"), layer=$("layer"),NS="http://www.w3.org/2000/svg";
let site=[],building=[],closed=false,edges={},mode="cad",moving=-1,stroke=[],view={cx:0,cy:0,s:10};
const STORE="building_survey_v05";let saveTimer;function persist(){try{localStorage.setItem(STORE,JSON.stringify({site,building,closed,edges}))}catch(e){status("端末保存できません: "+e.message)}}function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,250)}
function status(s){$("status").textContent=s}
function point(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)*400/r.width,y:(e.clientY-r.top)*480/r.height}}
function sc(p){return{x:200+(p.x-view.cx)*view.s,y:240-(p.y-view.cy)*view.s}}
function wc(p){return{x:(p.x-200)/view.s+view.cx,y:(240-p.y)/view.s+view.cy}}
function el(tag,attrs,text){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,String(attrs[k]));if(text!==undefined)n.textContent=text;layer.appendChild(n);return n}
function path(points,close){return points.map((p,i)=>{const q=sc(p);return(i?"L":"M")+q.x.toFixed(2)+" "+q.y.toFixed(2)}).join(" ")+(close?" Z":"")}
function render(){
layer.replaceChildren();
if(site.length>1){el("path",{d:path(site,true),fill:"#dcefe3",stroke:"#168451","stroke-width":2.5});site.forEach((p,i)=>{const q=sc(p);el("circle",{cx:q.x,cy:q.y,r:4,fill:"#168451"});el("text",{x:q.x+6,y:q.y-6,"font-size":11,fill:"#176444"},p.name||"K"+(i+1))})}
if(building.length){el("path",{d:path(building,closed),fill:closed?"#d9e8ff":"none",stroke:"#246bd2","stroke-width":2.5});building.forEach((p,i)=>{const q=sc(p);el("circle",{cx:q.x,cy:q.y,r:5,fill:"#246bd2"});if(i>0){const a=sc(building[i-1]);el("text",{x:(a.x+q.x)/2,y:(a.y+q.y)/2-6,"font-size":11,fill:"#1554a4"},"W"+String(i).padStart(2,"0"))}})}
if(stroke.length>1)el("polyline",{points:stroke.map(p=>p.x+","+p.y).join(" "),fill:"none",stroke:"#e28a22","stroke-width":3});
$("info").textContent="敷地："+site.length+"点 / 建物："+building.length+"点"+(closed?"（閉合）":"");scheduleSave();
}
function fit(){const pts=site.length?site:building;if(!pts.length){view={cx:0,cy:0,s:10};render();return}const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);view={cx:(xmin+xmax)/2,cy:(ymin+ymax)/2,s:Math.min(340/Math.max(xmax-xmin,1),405/Math.max(ymax-ymin,1))};render()}
function edgeList(){const e=$("edge");e.replaceChildren();let n=closed?building.length:Math.max(0,building.length-1);for(let i=0;i<n;i++){const o=document.createElement("option");o.value=i;o.textContent="W"+String(i+1).padStart(2,"0");e.appendChild(o)}if(!n){const o=document.createElement("option");o.textContent="辺を作図してください";e.appendChild(o)}}
function setmode(m){mode=m;["cad","free","select"].forEach(id=>$(id).classList.toggle("active",id===m));status(m==="cad"?"CAD作図：図面をタップして頂点を追加します。":m==="free"?"手書き：図面をなぞって概略形状を描きます。":"頂点移動：青い点をドラッグしてください。")}
$("demo").onclick=()=>{site=[{x:0,y:0,name:"K1"},{x:12.3,y:0,name:"K2"},{x:12.3,y:22.9,name:"K3"},{x:0,y:22.9,name:"K4"}];fit();status("サンプル敷地を表示しました：4点。緑色の敷地が見えるはずです。")};
$("fit").onclick=fit;
["cad","free","select"].forEach(m=>$(m).onclick=()=>setmode(m));
$("close").onclick=()=>{if(building.length<3){status("3点以上入力してください");return}closed=true;edgeList();render();status("建物外周を閉じました")};
$("undo").onclick=()=>{building.pop();closed=false;edgeList();render()};
$("clear").onclick=()=>{building=[];closed=false;edges={};edgeList();render();status("建物のみ消去しました")};
svg.addEventListener("pointerdown",e=>{e.preventDefault();const p=point(e);svg.setPointerCapture(e.pointerId);if(mode==="cad"){if(closed){status("建物消去後に作図してください");return}building.push(wc(p));edgeList();render()}else if(mode==="free"){stroke=[p];render()}else{moving=-1;let dist=16;building.forEach((v,i)=>{const q=sc(v),d=Math.hypot(q.x-p.x,q.y-p.y);if(d<dist){dist=d;moving=i}})}});
svg.addEventListener("pointermove",e=>{if(e.buttons===0&&e.pointerType==="mouse")return;const p=point(e);if(mode==="free"&&stroke.length){stroke.push(p);render()}if(mode==="select"&&moving>=0){building[moving]=wc(p);render()}});
svg.addEventListener("pointerup",()=>{if(mode==="free"&&stroke.length>=4){const raw=stroke.filter((_,i)=>i%Math.max(1,Math.floor(stroke.length/12))===0).map(wc);building=raw;closed=true;edgeList();status("手書きから概略形状を作成しました。頂点は後から調整してください。")}stroke=[];moving=-1;render()});
function decode(buf){try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch{return new TextDecoder("shift_jis").decode(buf)}}
function parse(s){const coords=new Map(),rings=[];let ring=null;for(const raw of s.split(/\r?\n/)){const c=raw.trim().split(",");if(c[0]==="A01"&&c.length>=5){const x=Number(c[3]),y=Number(c[4]);if(Number.isFinite(x)&&Number.isFinite(y)){coords.set(c[1],{x,y,name:c[2]});coords.set(c[2],{x,y,name:c[2]})}}if(c[0]==="D00"){ring=[];rings.push(ring)}if(c[0]==="B01"&&ring)ring.push(c[1])}const r=rings.find(r=>r.length>=3&&r.every(id=>coords.has(id)));const pts=r?r.map(id=>coords.get(id)):[...new Map([...coords.values()].map(p=>[p.name,p])).values()];if(pts.length<3)throw Error("座標が3点未満です");return pts}
$("file").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const text=decode(await f.arrayBuffer());site=parse(text);fit();status("SIMA読込成功："+f.name+" / "+site.length+"点。緑色の敷地を表示しました。")}catch(err){status("SIMA読込エラー："+err.message)}};
$("saveEdge").onclick=()=>{const i=Number($("edge").value);if(!Number.isInteger(i)||i<0||i>=building.length){status("辺を作図してください");return}edges[i]={length:$("length").value,measure:$("measure").value,column:$("column").value,furring:$("furring").value,wall:$("wall").value};persist();status("W"+String(i+1).padStart(2,"0")+"の測定記録を保存しました")};
$("calc").onclick=()=>{if($("measure").value!=="外壁外面"){status("この試作の計算は外壁外面から柱芯までのみです");return}const vals=[$("column"),$("furring"),$("wall")].map(x=>Number(x.value));if(vals.some(x=>!Number.isFinite(x)||x<0)){status("部材寸法を確認してください");return}const o=vals[0]/2+vals[1]+vals[2];$("offset").textContent="柱芯までの仮オフセット："+o.toFixed(1)+" mm（柱外側に胴縁・壁材が連続する場合）"};
function download(name,data){const a=document.createElement("a"),url=URL.createObjectURL(new Blob([data],{type:"text/plain"}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
$("json").onclick=()=>download("survey.json",JSON.stringify({version:5,site,building,closed,edges},null,2));
$("restore").onclick=()=>$("restoreFile").click();$("restoreFile").onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.site)||!Array.isArray(data.building))throw Error("データ形式が異なります");site=data.site;building=data.building;closed=!!data.closed;edges=data.edges||{};edgeList();fit();persist();status("JSONバックアップを復元しました")}catch(err){status("復元失敗: "+err.message)}};
$("dxf").onclick=()=>{const out=["0","SECTION","2","HEADER","9","$ACADVER","1","AC1015","9","$INSUNITS","70","6","0","ENDSEC","0","SECTION","2","ENTITIES"];for(const [name,pts,isClosed] of [["SITE_BOUNDARY",site,true],["BUILDING_MEASURED",building,closed]]){if(pts.length<2)continue;out.push("0","LWPOLYLINE","8",name,"90",String(pts.length),"70",isClosed?"1":"0");for(const p of pts)out.push("10",p.x.toFixed(6),"20",p.y.toFixed(6))}out.push("0","ENDSEC","0","EOF");download("building_survey.dxf",out.join("\r\n")+"\r\n");status("DXFを出力しました。Wingneoで取込検証してください。")};
$("sima").onclick=()=>{const pts=[...site,...building];const out=["G00,04,Building Survey Assist,","Z00,座標データ,","Z01,2,","A00,"];pts.forEach((p,i)=>out.push("A01,"+(i+1)+","+(p.name||"P"+(i+1))+","+p.x.toFixed(4)+","+p.y.toFixed(4)+",,"));out.push("A99,");download("survey_test.sim",out.join("\r\n")+"\r\n");status("SIMA試験データを出力しました。互換性未検証です。")};
try{const data=JSON.parse(localStorage.getItem(STORE)||"null");if(data&&Array.isArray(data.site)&&Array.isArray(data.building)){site=data.site;building=data.building;closed=!!data.closed;edges=data.edges||{};status("この端末の保存データを復元しました")}}catch(e){status("保存データを復元できません: "+e.message)}
fit();edgeList();
function network(){ $("offlineState").textContent=navigator.onLine?"オンライン（作図は端末内で処理）":"オフライン（保存済み画面で作業可能）"}window.addEventListener("online",network);window.addEventListener("offline",network);network();
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("./sw.js").catch(err=>status("オフライン準備に失敗: "+err.message))}
})();
</script></body></html>
